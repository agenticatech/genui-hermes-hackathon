<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GenUI cards motion study</title>
<!-- Replays one scripted task per use case through the real Desktop half (plugin/desktop/plugin.js),
     the real runtime, motion kit and default theme: only the three modules Desktop provides are
     stand-ins. Serve the repo root (python -m http.server 8765), open /demo/cards/?s=<scenario>. -->
<script type="importmap">
{"imports": {
  "@hermes/plugin-sdk": "data:text/javascript,export const host={};export const SandboxedFrame='iframe';export const STATUSBAR_AREAS={right:'r'};export const TRANSCRIPT_DIRECTIVE_AREA='d';",
  "react": "data:text/javascript,export const useEffect=()=>{},useLayoutEffect=()=>{},useMemo=(f)=>f(),useRef=(v)=>({current:v}),useState=(v)=>[v,()=>{}];",
  "react/jsx-runtime": "data:text/javascript,export const jsx=()=>null;"
}}
</script>
<style>
  :root {
    --bg: #ffffff; --fg: #24292f; --dim: #8b929b; --accent: #2f6fe4; --line: #e6e8eb; --card: #ffffff;
    --bubble: #f2f3f5; --font: Inter, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
    color-scheme: light;
  }
  :root[data-host=terminal] {
    --bg: #070b08; --fg: #b9f5c8; --dim: #5f9c70; --accent: #3ddc84; --line: #1f3a28; --card: #0c120e;
    --bubble: #0f1a12; --font: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
    color-scheme: dark;
  }
  :root[data-host=dark] {
    --bg: #17181a; --fg: #e6e8eb; --dim: #8b929b; --accent: #6ea0ff; --line: #2c2f33; --card: #1d1f22;
    --bubble: #26282c; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.55 var(--font); }
  body { min-height: 100vh; display: flex; flex-direction: column; }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); font-size: 12.5px; }
  .bar b { font-weight: 600; margin-right: 6px; }
  .bar button, .bar select { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; cursor: pointer; }
  .bar label { display: inline-flex; gap: 6px; align-items: center; color: var(--dim); }
  .hint { color: var(--accent); }
  .chat { flex: 1; width: 100%; max-width: 720px; margin: 0 auto; padding: 28px 16px 24px; }
  .user { display: flex; justify-content: flex-end; margin-bottom: 14px; }
  .bubble { max-width: 80%; background: var(--bubble); border-radius: 14px; padding: 6px 13px; }
  .thinking { display: flex; gap: 8px; align-items: center; color: var(--dim); font-size: 13px; margin: 0 0 10px 2px; }
  .thinking .secs { opacity: .7; }
  .shimmer { color: transparent; -webkit-background-clip: text; background-clip: text;
    background-image: linear-gradient(100deg, var(--dim) 0 38%, var(--fg) 50%, var(--dim) 62% 100%); background-size: 260% 100%;
    animation: shimmer 1.8s linear infinite; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -160% 0; } }
  iframe#card { display: block; width: 100%; height: 0; border: 0; background: transparent; }
  .agent { margin-top: 14px; min-height: 1em; }
  .agent code { font: 12.5px var(--mono); padding: 1px 5px; border-radius: 5px; background: color-mix(in srgb, var(--fg) 7%, transparent); }
  .agent .w { opacity: 0; animation: word .5s ease forwards; }
  @keyframes word { to { opacity: 1; } }
  .composer { position: sticky; bottom: 0; width: 100%; max-width: 720px; margin: 0 auto; padding: 0 16px 16px; background: linear-gradient(transparent, var(--bg) 30%); }
  .box { border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px 10px; background: var(--card); box-shadow: 0 2px 10px color-mix(in srgb, #000 5%, transparent); }
  .box .ph { color: var(--dim); margin-bottom: 14px; }
  .box .row { display: flex; gap: 8px; align-items: center; color: var(--dim); font-size: 12.5px; }
  .box .chip { border-radius: 999px; padding: 2px 10px; background: color-mix(in srgb, var(--fg) 6%, transparent); }
  .box .send { margin-left: auto; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); }
</style>
</head>
<body>
<div class="bar">
  <b>GenUI cards · motion study</b>
  <label>Scenario <select id="scenario"></select></label>
  <button id="replay" type="button">↻ Replay</button>
  <label>Speed <select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select></label>
  <label>Host theme <select id="theme"><option value="light">Light</option><option value="dark">Dark</option><option value="terminal">Terminal</option></select></label>
  <span class="hint" id="hint"></span>
</div>
<main class="chat" id="chat">
  <div class="user"><div class="bubble" id="ask"></div></div>
  <div class="thinking"><span>›</span><span id="think" class="shimmer">Thinking</span><span class="secs" id="secs">0s</span></div>
  <iframe id="card" sandbox="allow-scripts" title="GenUI card"></iframe>
  <div class="agent" id="agent"></div>
</main>
<div class="composer"><div class="box"><div class="ph">Ask anything, or type / for skills</div>
  <div class="row"><span class="chip">acme-webapp</span><span class="chip">Local</span><span class="send"></span></div></div></div>

<script type="module">
import { ComponentChannel, frameDocument, toDataUrl } from '/plugin/desktop/plugin.js'
import { SCENARIOS } from './scenarios.js'

const $ = (id) => document.getElementById(id)
const get = (u) => fetch(u, { cache: 'no-store' }).then((r) => (r.ok ? r.text() : ''))
// What library.frame_payload sends: the frame's document, with the motion kit then the frame
// runtime, the theme's kit then the component (library.frame_document, rebuilt here).
const [motion, frameRuntime, kit] = await Promise.all(['/plugin/motion.js', '/plugin/runtime.js', '/plugin/themes/default/kit.js'].map(get))
// (Every closing script tag below is written <\/script>, or it would close this page's own script.)
const inline = (js) => js.replace(/<\/(script)/gi, '<\\/$1')
const runtime = `${motion}\n${frameRuntime}`
const themes = {}
const themeOf = async (type) => (themes[type] ??= `${kit}\n${await get(`/plugin/themes/default/${type}.js`)}`)
const documentOf = (type, theme) => `<!doctype html><html><head><meta charset="utf-8"><script>${inline(runtime)}<\/script>` +
  `<script>${inline(theme)}<\/script></head><body><main id="genui-root" data-type="${type}"></main></body></html>`

// RFC 7386, as library.merge_patch applies update_component.
const mergePatch = (target, patch) => {
  if (!patch || typeof patch !== 'object' || Array.isArray(patch)) return structuredClone(patch)
  const out = target && typeof target === 'object' && !Array.isArray(target) ? structuredClone(target) : {}
  for (const [k, v] of Object.entries(patch)) { if (v === null) delete out[k]; else out[k] = mergePatch(out[k], v) }
  return out
}

// The Desktop half's theme bridge: the host's live tokens under the names themes read.
function prelude() {
  const cs = getComputedStyle(document.documentElement)
  const v = (n) => cs.getPropertyValue(n).trim()
  const tokens = { '--foreground': v('--fg'), '--muted-foreground': v('--dim'), '--accent': v('--accent'), '--border': v('--line'),
    '--card': v('--card'), '--host-mono': v('--mono'), '--host-font': v('--font') }
  const scheme = cs.colorScheme.includes('dark') ? 'dark' : 'light'
  return `<style>:root{color-scheme:${scheme};${Object.entries(tokens).map(([k, x]) => `${k}:${x}`).join(';')}}` +
    `html,body{margin:0;padding:0;background:transparent;color:var(--foreground);font-family:${v('--font')}}</style>`
}

let run = 0, props = null, rev = 0, channel = null, waiting = null, clock = null
const speed = () => Number($('speed').value) || 1
const sleep = (ms, id) => new Promise((ok, no) => setTimeout(() => (id === run ? ok() : no(new Error('stale'))), ms / speed()))

function say(text) {
  const box = $('agent')
  box.replaceChildren()
  text.split(/(`[^`]+`)/).filter(Boolean).forEach((part) => {
    for (const w of part.startsWith('`') ? [part] : part.split(/(?<= )/)) {
      const span = document.createElement(w.startsWith('`') ? 'code' : 'span')
      span.textContent = w.startsWith('`') ? w.slice(1, -1) : w
      span.className = 'w'
      span.style.animationDelay = `${box.childNodes.length * 28}ms`
      box.append(span)
    }
  })
}

function thinking(on, started) {
  clearInterval(clock)
  const tick = () => { $('secs').textContent = `${Math.max(0, Math.round((performance.now() - started) / 1000))}s` }
  if (on) { $('think').textContent = 'Thinking'; $('think').className = 'shimmer'; tick(); clock = setInterval(tick, 250) }
  else { tick(); $('think').textContent = 'Worked for'; $('think').className = '' }
}

async function play() {
  const id = ++run
  const sc = SCENARIOS[$('scenario').value]
  const theme = await themeOf(sc.type)
  if (id !== run) return
  waiting = null; props = null; rev = 0
  const ctx = { values: {} }
  $('ask').textContent = sc.ask
  $('agent').replaceChildren(); $('hint').textContent = ''
  const frame = $('card')
  frame.style.height = '0px'
  channel = new ComponentChannel({
    submit: (text) => { const turn = JSON.parse(text); if (waiting && turn.action_id === waiting.id) waiting.done(turn); return true },
    onResize: (h) => { frame.style.height = `${h}px` },
  })
  const started = performance.now()
  thinking(true, started)
  // "Worked for" counts the agent's first stretch only, like the host's line above a reply.
  let worked = false
  const stop = () => { if (!worked) { worked = true; thinking(false, started) } }
  try {
    for (const step of sc.steps) {
      if (step.await) {
        stop()
        $('hint').textContent = `waiting for your click in the card`
        const turn = await new Promise((done) => { waiting = { id: step.await, done } })
        if (id !== run) return
        ctx.values = turn.values || {}
        waiting = null
        $('hint').textContent = ''
        continue
      }
      await sleep(step.wait, id)
      const data = typeof (step.show || step.patch) === 'function' ? (step.show || step.patch)(ctx) : (step.show || step.patch)
      if (step.show) {
        props = data
        channel.attach(null)
        frame.src = toDataUrl(frameDocument({ type: sc.type, document: documentOf(sc.type, theme) }, prelude()))
        channel.attach(frame.contentWindow)
      } else props = mergePatch(props, data)
      channel.accept({ rev: ++rev, props, id: sc.type })
      if (step.say) { stop(); say(step.say) }
    }
    stop()
  } catch (e) { if (e.message !== 'stale') throw e }
}

addEventListener('message', (e) => channel && channel.handle(e))
for (const [key, sc] of Object.entries(SCENARIOS)) $('scenario').append(new Option(sc.label, key))
const params = new URLSearchParams(location.search)
if (SCENARIOS[params.get('s')]) $('scenario').value = params.get('s')
if (params.get('theme')) { $('theme').value = params.get('theme'); document.documentElement.dataset.host = params.get('theme') }
const remember = () => history.replaceState(null, '', `?s=${$('scenario').value}&theme=${$('theme').value}`)
$('replay').onclick = play
$('scenario').onchange = () => { remember(); play() }
$('theme').onchange = () => { document.documentElement.dataset.host = $('theme').value; remember(); play() }
play()
</script>
</body>
</html>
