<!doctype html>
<html><head><meta charset="utf-8">
<style>
/* Hermes Desktop (dark theme of the v2 recordings), as the chat would look WITHOUT the GenUI plugin:
   the same run told in text, the decision typed back by hand. The newest lines stay in view. */
:root { --bg: #0d0e13; --bubble: #0d1420; --border: #1d2738; --text: #e3e6eb; --dim: #8a909a; --code: #1a1d25; --accent: #8fb4ff; }
html, body { margin: 0; background: var(--bg); }
body { width: 640px; height: 1024px; overflow: hidden; position: relative; font-family: "Segoe UI", system-ui, sans-serif; color: var(--text); }
#view { position: absolute; left: 14px; right: 14px; top: 14px; bottom: 74px; overflow: hidden; }
#chat { position: absolute; left: 0; right: 0; top: 0; display: grid; }
.bubble { border: 1px solid var(--border); background: var(--bubble); padding: 8px 12px; font-size: 13.5px; line-height: 19px; border-radius: 6px; margin: 4px 0 10px; }
.row { color: var(--dim); font-size: 12px; line-height: 22px; padding-left: 4px; }
.row .spin { display: inline-block; width: 1.3em; color: var(--accent); }
.say { font-size: 13.5px; line-height: 21px; padding: 6px 4px 12px; white-space: pre-wrap; }
.say b { font-weight: 600; color: #fff; }
.say code { font: 12.5px Consolas, monospace; background: var(--code); padding: 0 4px; border-radius: 4px; }
.input { position: absolute; left: 14px; right: 14px; bottom: 16px; height: 42px; box-sizing: border-box; border: 1px solid var(--border);
  background: var(--bubble); border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 13.5px; }
.input .plus { color: var(--dim); font-size: 17px; }
.input .ph { color: var(--dim); }
.caret { display: inline-block; width: 1.5px; height: 16px; background: var(--text); vertical-align: -3px; margin-left: 1px; }
</style></head>
<body>
<div id="view"><div id="chat"></div></div>
<div class="input"><span class="plus">+</span><span id="field"></span></div>
<script>
let DATA = { events: [] };
window.setData = (d) => { DATA = d; };
const SPIN = "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏";
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
// Markdown-ish text (**bold**, `code`) cut after n visible characters, so replies stream in.
function partial(text, n) {
  let out = "", left = n;
  for (const tok of text.split(/(\*\*[^*]+\*\*|`[^`]+`)/)) {
    if (left <= 0) break;
    const bold = tok.startsWith("**"), code = tok.startsWith("`");
    const body = bold ? tok.slice(2, -2) : code ? tok.slice(1, -1) : tok;
    const piece = esc(body.slice(0, left));
    out += bold ? `<b>${piece}</b>` : code ? `<code>${piece}</code>` : piece;
    left -= body.length;
  }
  return out;
}
const plain = (text) => text.replace(/\*\*|`/g, "");
window.renderAt = (t) => {
  const blocks = [];
  let activity = null, typed = null;
  for (const e of DATA.events) {
    if (e.t > t) continue;
    const k = Math.min(1, (t - e.t) / (e.dur || 1e-9));
    if (e.type === "bubble") blocks.push(`<div class="bubble">${esc(e.text)}</div>`);
    else if (e.type === "activity") activity = e.text;
    else if (e.type === "row") { activity = null; blocks.push(`<div class="row">${esc(e.text)}</div>`); }
    else if (e.type === "say") { activity = null; blocks.push(`<div class="say">${partial(e.text, Math.ceil(plain(e.text).length * k))}</div>`); }
    else if (e.type === "type") typed = e.text.slice(0, Math.ceil(e.text.length * k));
    else if (e.type === "send") typed = null;
  }
  if (activity) blocks.push(`<div class="row"><span class="spin">${SPIN[Math.floor(t * 12) % SPIN.length]}</span>${esc(activity)}</div>`);
  const html = blocks.join("");
  const chat = document.getElementById("chat");
  if (chat.innerHTML !== html) chat.innerHTML = html;
  // Keep the newest lines in view, as the app scrolls to the bottom of the conversation.
  const over = chat.scrollHeight - document.getElementById("view").clientHeight;
  chat.style.top = `${-Math.max(0, over)}px`;
  const field = document.getElementById("field");
  const fieldHtml = typed === null ? `<span class="ph">Describe what you need</span>` : `${esc(typed)}<span class="caret"></span>`;
  if (field.innerHTML !== fieldHtml) field.innerHTML = fieldHtml;
  return html + "|" + fieldHtml + "|" + Math.max(0, over);
};
</script>
</body></html>
