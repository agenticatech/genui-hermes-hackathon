name: genui
version: "0.2.1"
requires_hermes: ">=0.22.5"
python_dependencies:
  - "jsonschema>=4,<5"  # props validation (library.py); Hermes ships it only with the mcp extra
description: Generative UI for Hermes. The agent shows a pre-designed live component early, updates it in place as it works, and asks for a decision only when one is needed.
author: agenticatech
provides_tools:
  - show_component
  - update_component
  - ask_user
provides_hooks:
  - pre_llm_call
